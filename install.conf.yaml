- defaults:
    link:
      create: true
      relink: true

- clean:
    ~/:
      force: true
    ~/.config:
      recursive: true

- link:
    ~/.config/nvim:
        path: configs/nvim
    ~/.config/zed:
        path: configs/zed
    ~/.config/ghostty:
        path: configs/ghostty
    ~/.config/alacritty:
        path: configs/alacritty
    ~/.config/mise:
        path: configs/mise
    ~/.config/tmux:
        path: configs/tmux
    ~/.config/zellij:
        path: configs/zellij
    ~/.config/yazi:
        path: configs/yazi
    ~/.config/karabiner:
        path: configs/karabiner
    ~/.config/fish:
        path: configs/fish
    ~/.config/lazygit:
        path: configs/lazygit
    ~/.config/opencode:
        path: configs/opencode
    ~/.config/starship.toml:
        path: configs/starship/starship.toml
    ~/.hammerspoon:
        path: configs/hammerspoon
    ~/.zshrc:
        path: configs/zsh/.zshrc


- shell:
    - [git submodule update --init --recursive, Installing submodules]
    -
      description: Installing linux dependencies
      command: |
        fish -c 'if test (uname) = Linux; and not dpkg -s build-essential >/dev/null 2>&1
          sudo apt-get update
          and sudo apt-get install -y build-essential
        end'
      stdin: true
      stdout: true
      stderr: true
    -
      description: Installing homebrew packages
      command: brew bundle --cleanup --force-cleanup -v --file configs/Brewfile
      stdin: true
      stdout: true
      stderr: true
    -
      description: Install mise tools
      command: mise install
      stdin: true
      stdout: true
      stderr: true
    -
      description: Applying macOS settings
      command: fish -c 'if test (uname) = Darwin; fish platforms/mac/settings.fish; end'
      stdin: true
      stdout: true
      stderr: true
